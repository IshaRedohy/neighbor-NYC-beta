name: neighbor-beta-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neighbor
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: neighborhub_test
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbor -d neighborhub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/test-only-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["127.0.0.1:17687:7687"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
