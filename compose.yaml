services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neighbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: neighborhub
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbor -d neighborhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_started}
    restart: unless-stopped
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://neighbor:${POSTGRES_PASSWORD}@postgres:5432/neighborhub
      NEO4J_URI: bolt://neo4j:7687
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "python -m backend.cli migrate && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://neighbor:${POSTGRES_PASSWORD}@postgres:5432/neighborhub
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    command: ["python", "-m", "backend.cli", "worker"]
    restart: unless-stopped
volumes:
  postgres_data:
  neo4j_data:
